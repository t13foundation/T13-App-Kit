name: CI (manual)

# GitHub Minutes are restricted. Never run on push or pull_request.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-kit-manual-checks
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Source integrity and boundary tests
        run: |
          node scripts/check-source-integrity.mjs
          node --experimental-strip-types --test tests/*.test.mjs
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Web build
        run: pnpm build
      - name: Web typecheck (installed TypeScript)
        run: pnpm typecheck
      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Server typecheck
        working-directory: server
        run: bun run typecheck
      - name: Server unit tests
        working-directory: server
        run: ./node_modules/.bin/vitest run tests/unit

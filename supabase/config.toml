project_id = "t13-app-kit-demo"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true
schema_paths = ["./schema/*.sql"]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "http://localhost:4311"
additional_redirect_urls = ["http://localhost:4311/notes", "http://127.0.0.1:4311/notes"]
jwt_expiry = 600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Confirm your account"
content_path = "./supabase/templates/confirmation.html"

[analytics]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false
